# Optional HTTPS paths for the Orbit Payments Stripe and Razorpay handlers.
# Keep these paths aligned with the application router; this only forwards the requests.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orbit-payment-webhooks
  namespace: orbit
spec:
  parentRefs:
    - name: orbit-public
      sectionName: https
  hostnames:
    - app.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /webhooks/stripe
        - path:
            type: Exact
            value: /webhooks/razorpay
      backendRefs:
        - name: orbit-core
          port: 8000
