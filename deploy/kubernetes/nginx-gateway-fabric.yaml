# Reference only: install NGINX Gateway Fabric and the Kubernetes Gateway API CRDs separately.
# Replace the hostname, namespace, TLS Secret, Service name, and port for the deployment.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: orbit-public
  namespace: orbit
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      hostname: app.example.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: app.example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: app-example-com-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orbit-http-redirect
  namespace: orbit
spec:
  parentRefs:
    - name: orbit-public
      sectionName: http
  hostnames:
    - app.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orbit-application
  namespace: orbit
spec:
  parentRefs:
    - name: orbit-public
      sectionName: https
  hostnames:
    - app.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: orbit-core
          port: 8000
